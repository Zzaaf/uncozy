<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- dark background -->
  <rect width="16" height="16" fill="#080820"/>

  <!-- character body (yellow) -->
  <rect x="4" y="1" width="8" height="6" fill="#ffdd00"/>
  <!-- visor strip (pink) -->
  <rect x="4" y="3" width="8" height="2" fill="#ff006e"/>
  <!-- eye white -->
  <rect x="9" y="3" width="2" height="1" fill="#ffffff"/>
  <!-- eye pupil (cyan) -->
  <rect x="10" y="3" width="1" height="1" fill="#00e5ff"/>
  <!-- legs -->
  <rect x="4" y="7" width="3" height="2" fill="#ffdd00"/>
  <rect x="9" y="7" width="3" height="2" fill="#ffdd00"/>

  <!-- platform: 4 cubes separated by 1px gaps -->
  <rect x="0"  y="12" width="3" height="3" fill="#00ff88"/>
  <rect x="4"  y="12" width="3" height="3" fill="#00e5ff"/>
  <rect x="8"  y="12" width="3" height="3" fill="#00ff88"/>
  <rect x="12" y="12" width="4" height="3" fill="#00e5ff"/>

  <!-- subtle glow line under platform -->
  <rect x="0" y="15" width="16" height="1" fill="#00ff88" opacity="0.5"/>
</svg>
